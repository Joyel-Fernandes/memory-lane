<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journey - Memory Lane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    colors: {
                        brand: { bg: '#FDFBF7', sidebar: '#1B3C2B', sage: '#E2E8E4', text: '#1C1917', accent: '#4B7B61' }
                    }
                }
            }
        }
    </script>
    <style>html { font-size: 18px; }</style>
</head>
<body class="flex h-screen overflow-hidden bg-brand-bg">

    <!-- Sidebar (Matches Dashboard, but highlights Journey) -->
    <aside class="w-72 bg-brand-sidebar text-white flex flex-col flex-shrink-0 relative shadow-xl z-20">
        <div class="p-8 flex items-center gap-3">
            <svg class="w-8 h-8 text-green-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4c-4.418 0-8 3.582-8 8s3.582 8 8 8c1.5 0 2.9-.4 4.1-1.1l3.2 1.1-1.1-3.2c.7-1.2 1.1-2.6 1.1-4.1 0-4.418-3.582-8-8-8z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 12c-2.21 0-4-1.79-4-4"></path>
            </svg>
            <span class="text-2xl font-bold tracking-wide">Memory Lane</span>
        </div>
        <nav class="flex-1 px-4 overflow-y-auto">
            <ul class="space-y-2">
                <li>
                    <a href="/pages/dashboard.html" class="flex items-center gap-4 px-4 py-4 rounded-xl text-gray-300 hover:text-white hover:bg-white/10 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        Today
                    </a>
                </li>
                <li>
                    <a href="#" class="flex items-center gap-4 px-4 py-4 rounded-xl bg-white/10 text-white font-semibold transition-colors hover:bg-white/20">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        My journey
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-y-auto w-full max-w-4xl mx-auto p-10">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Your Life's Journey</h1>
            <p class="text-gray-500 mt-2 text-lg">A look back at the beautiful eras of your life.</p>
        </header>

        <div id="journey-container" class="w-full">
            <!-- Loading State -->
            <div class="flex flex-col items-center justify-center p-12 bg-white rounded-3xl shadow-sm border border-gray-100">
                <svg class="animate-spin h-10 w-10 text-brand-accent mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <p class="text-xl text-gray-600 font-semibold">Writing your story...</p>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById("journey-container");
            const patientDataString = sessionStorage.getItem("patientProfile");
            
            if (!patientDataString) {
                window.location.href = "/pages/setup.html";
                return;
            }
            
            // Check if we already generated the journey in this session to save API calls
            const savedJourney = sessionStorage.getItem("journeyData");
            if (savedJourney) {
                renderJourney(JSON.parse(savedJourney));
                return;
            }

            const patientData = JSON.parse(patientDataString);
            
            // We need to fetch the original full data from memoryGameData to get the exact year and hobbies
            const fullDataString = sessionStorage.getItem("memoryGameData");
            if (!fullDataString) {
                 window.location.href = "/pages/setup.html";
                 return;
            }
            
            // Re-creating the payload to send to the backend
            // In a production app, you might store birth_year in patientProfile as well
            const payload = {
                birth_year: patientData.birthYear || 1952, // Fallback logic
                birth_place: patientData.location,
                hobbies: patientData.hobbies || ["music"] 
            };

            try {
                const response = await fetch("/generate-journey", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("Failed to load journey");
                
                const journey = await response.json();
                sessionStorage.setItem("journeyData", JSON.stringify(journey));
                renderJourney(journey);

            } catch (error) {
                console.error(error);
                container.innerHTML = `
                    <div class="bg-red-50 text-red-800 p-6 rounded-2xl border border-red-200">
                        <p class="font-bold text-xl">Could not load your journey at this time.</p>
                        <p class="mt-2 text-base">Please try again later.</p>
                    </div>`;
            }

            function renderJourney(journey) {
                let html = `<div class="space-y-8 border-l-4 border-brand-accent/40 pl-6 ml-4">`;
                
                journey.chapters.forEach(chapter => {
                    html += `
                        <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow relative">
                            <!-- Timeline Dot -->
                            <div class="absolute -left-[35px] top-8 w-6 h-6 bg-brand-accent rounded-full border-4 border-brand-bg"></div>
                            
                            <h3 class="text-2xl font-bold text-gray-800 mb-3">${chapter.era_name}</h3>
                            <p class="text-gray-600 text-lg leading-relaxed mb-6">${chapter.sensory_memory}</p>
                            <div class="inline-flex items-center gap-2 bg-brand-sage/40 text-brand-sidebar text-sm px-4 py-2 rounded-xl font-bold">
                                ✨ ${chapter.historical_milestone}
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
            }
        });
    </script>
</body>
</html>
