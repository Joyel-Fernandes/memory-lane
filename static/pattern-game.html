<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Matrix Memory Game</title>
    
    <!-- Google Fonts: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration for Custom Colors & Font -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FDFBF7',
                        stone: '#1C1917',
                        sage: '#E2E8E4',
                        accentGreen: '#4B7B61',
                        darkGreen: '#1B3C2B',
                        mutedGrey: '#D4D4D8' // Soft gray for gentle incorrect feedback
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for Gentle Animations -->
    <style>
        body {
            background-color: #FDFBF7;
            color: #1C1917;
            /* Prevent double-tap zoom on touch devices */
            touch-action: manipulation;
        }

        /* Gentle shake for incorrect selection */
        @keyframes gentle-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
        }

        .animate-shake {
            animation: gentle-shake 0.4s ease-in-out;
        }

        /* Tile base styles */
        .game-tile {
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .game-tile:active {
            transform: scale(0.96);
        }

        /* Overlay transition */
        #success-overlay {
            transition: opacity 0.5s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

    <!-- Header Navigation -->
    <header class="p-4 w-full flex justify-between items-center">
        <button onclick="window.history.back();" class="text-darkGreen font-bold text-lg flex items-center hover:opacity-80 transition-opacity p-2" aria-label="Back to Dashboard">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to Dashboard
        </button>
    </header>

    <!-- Main Game Area -->
    <main class="flex-grow flex flex-col items-center justify-center p-4">
        
        <div class="max-w-md w-full flex flex-col items-center">
            
            <!-- Game Info / Instructions -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold text-darkGreen mb-2">Memory Grid</h1>
                <h2 id="level-display" class="text-xl font-bold text-stone mb-2">Level 1</h2>
                <p id="instruction-text" class="text-lg text-stone h-8 transition-opacity duration-300">
                    Get ready...
                </p>
            </div>

            <!-- Grid Container -->
            <!-- The grid columns are dynamic, we handle them via JS classes grid-cols-3 or grid-cols-4 -->
            <div id="grid-container" class="grid gap-3 sm:gap-4 mb-8 w-full max-w-[320px] sm:max-w-[400px] mx-auto p-4 bg-white rounded-2xl shadow-sm border border-sage">
                <!-- Squares injected by JS -->
            </div>

            <!-- Hint Button -->
            <button id="hint-btn" onclick="showHint()" class="hidden bg-darkGreen text-cream text-lg font-bold py-3 px-8 rounded-full shadow-md hover:bg-opacity-90 active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-accentGreen focus:ring-opacity-50">
                Need a hint?
            </button>

        </div>
    </main>

    <!-- Success Overlay Modal -->
    <div id="success-overlay" class="fixed inset-0 bg-cream bg-opacity-90 flex items-center justify-center z-50 opacity-0 pointer-events-none">
        <div class="bg-white p-8 rounded-3xl shadow-lg border-2 border-sage text-center max-w-sm mx-4 transform scale-95 transition-transform duration-300" id="success-modal-content">
            <h2 class="text-3xl font-extrabold text-darkGreen mb-4">Wonderful!</h2>
            <p class="text-lg text-stone mb-8">You remembered all the squares perfectly.</p>
            <button onclick="nextLevel()" class="bg-accentGreen text-cream text-xl font-bold py-4 px-10 rounded-full shadow-md hover:bg-opacity-90 active:scale-95 transition-all w-full focus:outline-none focus:ring-4 focus:ring-darkGreen focus:ring-opacity-50">
                Next Level
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- Game Configuration ---
        // Defines the grid size and number of tiles to remember for each level
        const levelConfig = [
            { size: 3, active: 2 }, // Level 1
            { size: 3, active: 3 }, // Level 2
            { size: 3, active: 4 }, // Level 3
            { size: 4, active: 4 }, // Level 4
            { size: 4, active: 5 }, // Level 5
            { size: 4, active: 6 }, // Level 6
            { size: 4, active: 7 }  // Level 7+
        ];

        // --- Game State ---
        let currentLevelIndex = 0;
        let pattern = [];
        let playerSelected = [];
        let gameState = 'initializing'; // initializing, showing, waiting, animating, success
        let hintActive = false;

        // --- DOM Elements ---
        const gridContainer = document.getElementById('grid-container');
        const levelDisplay = document.getElementById('level-display');
        const instructionText = document.getElementById('instruction-text');
        const hintBtn = document.getElementById('hint-btn');
        const successOverlay = document.getElementById('success-overlay');
        const successModalContent = document.getElementById('success-modal-content');

        // --- Game Functions ---

        // Initialize the game when page loads
        window.onload = () => {
            startLevel();
        };

        function startLevel() {
            gameState = 'initializing';
            playerSelected = [];
            pattern = [];
            hintActive = false;
            
            // Get config (use max available if level exceeds array length)
            const config = levelConfig[Math.min(currentLevelIndex, levelConfig.length - 1)];
            
            // Update UI
            levelDisplay.textContent = `Level ${currentLevelIndex + 1}`;
            instructionText.textContent = "Watch the pattern...";
            hintBtn.classList.add('hidden');
            
            // Setup Grid
            buildGrid(config.size);
            
            // Generate Pattern
            generatePattern(config.size * config.size, config.active);

            // Wait a moment before showing the pattern so user can orient themselves
            setTimeout(() => {
                showPattern();
            }, 800);
        }

        function buildGrid(size) {
            gridContainer.innerHTML = '';
            
            // Set CSS Grid classes
            gridContainer.className = `grid gap-3 sm:gap-4 mb-8 w-full max-w-[320px] sm:max-w-[400px] mx-auto p-4 bg-white rounded-2xl shadow-sm border border-sage`;
            if (size === 3) {
                gridContainer.classList.add('grid-cols-3');
            } else if (size === 4) {
                gridContainer.classList.add('grid-cols-4');
            }

            // Create tiles
            for (let i = 0; i < size * size; i++) {
                const tile = document.createElement('button');
                tile.className = 'game-tile bg-sage rounded-2xl aspect-square w-full shadow-inner focus:outline-none focus:ring-4 focus:ring-darkGreen focus:ring-opacity-40';
                tile.dataset.index = i;
                tile.setAttribute('aria-label', `Grid tile ${i + 1}`);
                tile.onclick = () => handleTileClick(i, tile);
                gridContainer.appendChild(tile);
            }
        }

        function generatePattern(totalTiles, activeCount) {
            const allIndices = Array.from({length: totalTiles}, (_, i) => i);
            // Shuffle and pick
            for (let i = allIndices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allIndices[i], allIndices[j]] = [allIndices[j], allIndices[i]];
            }
            pattern = allIndices.slice(0, activeCount);
        }

        function showPattern() {
            gameState = 'showing';
            const tiles = gridContainer.children;
            
            // Light them up
            pattern.forEach(index => {
                tiles[index].classList.remove('bg-sage');
                tiles[index].classList.add('bg-accentGreen');
            });

            // Turn them off after 2.5 seconds (gentle pace)
            setTimeout(() => {
                pattern.forEach(index => {
                    tiles[index].classList.remove('bg-accentGreen');
                    tiles[index].classList.add('bg-sage');
                });
                
                // Switch to waiting state
                gameState = 'waiting';
                instructionText.textContent = "Tap the squares that lit up!";
                hintBtn.classList.remove('hidden');
                
            }, 2500);
        }

        function handleTileClick(index, tileElement) {
            // Only accept clicks during the 'waiting' state
            if (gameState !== 'waiting' || hintActive) return;

            // Prevent double clicking already correctly selected tiles
            if (playerSelected.includes(index)) return;

            if (pattern.includes(index)) {
                // Correct Choice
                playerSelected.push(index);
                
                // Visual feedback: stay lit
                tileElement.classList.remove('bg-sage');
                tileElement.classList.add('bg-accentGreen');

                // Check Win Condition
                if (playerSelected.length === pattern.length) {
                    gameState = 'success';
                    handleSuccess();
                }
            } else {
                // Incorrect Choice - Gentle Feedback
                gameState = 'animating'; // Prevent other clicks during animation
                
                tileElement.classList.remove('bg-sage');
                tileElement.classList.add('bg-mutedGrey'); // Soft gray instead of red
                tileElement.classList.add('animate-shake');
                
                // Revert after brief moment
                setTimeout(() => {
                    tileElement.classList.remove('bg-mutedGrey');
                    tileElement.classList.remove('animate-shake');
                    tileElement.classList.add('bg-sage');
                    gameState = 'waiting'; // Allow clicks again
                }, 500);
            }
        }

        function showHint() {
            if (gameState !== 'waiting' || hintActive) return;
            hintActive = true;
            
            const tiles = gridContainer.children;
            
            // Find missing pattern tiles
            const missing = pattern.filter(idx => !playerSelected.includes(idx));
            
            // Gently flash them
            missing.forEach(index => {
                tiles[index].classList.remove('bg-sage');
                tiles[index].classList.add('bg-accentGreen', 'opacity-60'); // Slightly faded to indicate it's a hint
            });

            // Turn off hint after 1.5 seconds
            setTimeout(() => {
                missing.forEach(index => {
                    tiles[index].classList.remove('bg-accentGreen', 'opacity-60');
                    tiles[index].classList.add('bg-sage');
                });
                hintActive = false;
            }, 1500);
        }

        function handleSuccess() {
            hintBtn.classList.add('hidden');
            instructionText.textContent = "";
            
            // Slight delay before showing overlay for a smoother experience
            setTimeout(() => {
                successOverlay.classList.remove('opacity-0', 'pointer-events-none');
                successModalContent.classList.remove('scale-95');
                successModalContent.classList.add('scale-100');
            }, 300);
        }

        function nextLevel() {
            // Hide Overlay
            successOverlay.classList.add('opacity-0', 'pointer-events-none');
            successModalContent.classList.remove('scale-100');
            successModalContent.classList.add('scale-95');
            
            currentLevelIndex++;
            
            // Start next level after overlay finishes transitioning out
            setTimeout(() => {
                startLevel();
            }, 400);
        }

    </script>
</body>
</html>
